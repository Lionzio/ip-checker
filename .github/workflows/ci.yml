name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Desde a S28-04, a CI pesada não roda duas vezes no mesmo commit nem quando só a documentação
    # mudou. A main só avança por fast-forward da develop (branch-policy), então o commit que chega
    # nela já passou pela CI completa na develop: aqui só se confere que passou. Na develop, depois
    # do merge squash, o conteúdo é o mesmo do último commit do PR, que já passou pela CI completa:
    # também só se confere (cota de 2.000 minutos por mês, esgotada em 08/10/2026; P-19). Um PR ou
    # push que só muda arquivos .md também pula os testes. Na dúvida (sem base para comparar,
    # primeiro push de uma branch, conteúdo diferente do testado), roda tudo.
    name: O que precisa rodar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      heavy: ${{ steps.decide.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decidir
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REPOSITORY: ${{ github.repository }}
        run: |
          heavy=true
          if [ "$EVENT" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            green=$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&branch=develop&event=push&status=success" \
              -q '[.workflow_runs[] | select(.name == "CI")] | length')
            if [ "$green" != "0" ]; then
              heavy=false
              echo "::notice::$GITHUB_SHA já passou pela CI completa na develop; na main, só a política de branches."
            else
              echo "::warning::Nenhuma CI verde da develop para $GITHUB_SHA; roda tudo."
            fi
          elif [ "$EVENT" = "push" ] && [ "$GITHUB_REF" = "refs/heads/develop" ] && \
               pr_head=$(gh api "repos/$REPOSITORY/commits/$GITHUB_SHA/pulls" \
                 -q '[.[] | select(.merged_at != null)][0].head.sha // ""') && [ -n "$pr_head" ]; then
            # Depois do merge squash de um PR (economia de minutos, 08/10/2026): se a árvore do
            # commit é idêntica à do último commit do PR e a CI do PR passou nele, os testes já
            # rodaram neste mesmo conteúdo. Comparar árvores pela API evita buscar o PR no git.
            tested=$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$pr_head&event=pull_request&status=success" \
              -q '[.workflow_runs[] | select(.name == "CI")] | length')
            tree_now=$(gh api "repos/$REPOSITORY/commits/$GITHUB_SHA" -q .commit.tree.sha)
            tree_pr=$(gh api "repos/$REPOSITORY/commits/$pr_head" -q .commit.tree.sha)
            if [ "$tested" != "0" ] && [ "$tree_now" = "$tree_pr" ]; then
              heavy=false
              echo "::notice::Mesmo conteúdo do PR ($pr_head), que já passou pela CI completa; aqui só se confere."
            else
              echo "::warning::O conteúdo difere do último commit testado do PR (ou a CI dele não passou); roda tudo."
            fi
          elif [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE" "$GITHUB_SHA")
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '\.md$'; then
              heavy=false
              echo "::notice::Só documentação (.md) mudou; os testes não rodam."
            fi
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (lint, tipos, testes)
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      # Banco descartável para as migrações e o repositório de contas (S13-01). Só existe durante
      # o job, no próprio runner; a senha não protege nada além dele.
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: ipc_test
          POSTGRES_PASSWORD: ci-descartavel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ipc_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # A mesma versão do uv das imagens (UV_IMAGE nos Dockerfiles).
          version: "0.12.21"
      - name: Instalar Python 3.13 e dependências
        run: |
          uv python install 3.13
          uv sync --locked
      - name: Ruff (lint e segurança)
        run: uv run ruff check .
      - name: Ruff (formatação)
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Fronteiras de arquitetura (import-linter)
        run: uv run lint-imports
      # FR-21 (S24-02): o mesmo comando que monitores e professores rodam antes do PR. Questões
      # que liberam proibições gerais aparecem como aviso no PR: só entram com professor (C-02).
      - name: Ruleset e questões (ipc-rules validate, com os casos golden)
        run: uv run ipc-rules validate ../rulesets --golden tests/golden
      - name: Pytest (motor, API, contrato OpenAPI, banco e cobertura >= 90%)
        env:
          IPC_TEST_DATABASE_URL: postgresql://postgres:ci-descartavel@127.0.0.1:5432/ipc_test
        run: uv run pytest

  gabaritos:
    # Gabaritos de períodos anteriores com zero violação (Q-14, S20). Eles são respostas oficiais e
    # ficam num repositório privado separado (Lionzio/ip-checker-gabaritos): o job só roda quando
    # a variável GABARITOS_REPO (dono/repositório) está definida, e baixa o repositório com uma chave
    # de implantação só de leitura, cuja parte privada fica no segredo GABARITOS_SSH_KEY (ADR-10;
    # antes, um token pessoal). A pasta gabaritos/ é ignorada pelo Git, e os testes mostram só
    # arquivo, regra e linha, nunca o código.
    name: Gabaritos (zero violação, Q-14)
    # PRs do Dependabot não recebem os segredos do Actions: sem a chave, o checkout falharia.
    needs: changes
    if: >-
      needs.changes.outputs.heavy == 'true' &&
      vars.GABARITOS_REPO != '' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Baixar os gabaritos (repositório privado, só leitura)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.GABARITOS_REPO }}
          ssh-key: ${{ secrets.GABARITOS_SSH_KEY }}
          path: gabaritos
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # A mesma versão do uv das imagens (UV_IMAGE nos Dockerfiles).
          version: "0.12.21"
      - name: Instalar Python 3.13 e dependências
        working-directory: backend
        run: |
          uv python install 3.13
          uv sync --locked
      - name: Cada gabarito sem violação na sua lista
        working-directory: backend
        env:
          IPC_GABARITOS_DIR: ${{ github.workspace }}/gabaritos
        run: uv run pytest tests/official_answers --no-cov -q

  security:
    name: Segurança (isolamento, submissões maliciosas e imagem do piloto)
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # A mesma versão do uv das imagens (UV_IMAGE nos Dockerfiles).
          version: "0.12.21"
      - name: Instalar Python 3.13 e dependências de teste
        working-directory: backend
        run: |
          uv python install 3.13
          uv sync --locked
      - name: Build da imagem
        # Só para o compose interpretar o arquivo; a suíte sorteia as senhas de verdade.
        env:
          IPC_DB_ADMIN_PASSWORD: so-para-o-build
          IPC_DB_API_PASSWORD: so-para-o-build
          IPC_DEV_INITIAL_PASSWORD: So-para-o-build-1
        run: docker compose -f deploy/compose.yaml build
      - name: Suíte de segurança (DoD, seção 8, itens 2 a 12)
        working-directory: backend
        env:
          IPC_SECURITY_TESTS: "1"
        run: uv run pytest tests/security --no-cov -v

  frontend:
    name: Frontend (lint, tipos, testes, build)
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Tipos gerados do OpenAPI em dia (docs/openapi.json -> src/types/openapi.ts)
        run: |
          npm run gen:api
          git diff --exit-code -- src/types/openapi.ts
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Build de produção
        run: npm run build
      - name: Build do piloto (Vercel, com o rewrite de /api/* e os cabeçalhos de segurança)
        env:
          IPC_API_ORIGIN: https://ip-checker-api.onrender.com
        run: npm run build:vercel

  e2e:
    name: Smoke e2e (compose completo + Playwright)
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Senhas desta execução (deploy/.env, nunca versionado)
        run: |
          python3 - <<'EOF'
          import secrets
          values = {
              "IPC_DB_ADMIN_PASSWORD": secrets.token_urlsafe(24),
              "IPC_DB_API_PASSWORD": secrets.token_urlsafe(24),
              "IPC_DEV_INITIAL_PASSWORD": "Dev-" + secrets.token_urlsafe(12) + "!",
              # Feedback com a IA falsa: texto fixo, sem rede nem chave (S19-01).
              "IPC_LLM_PROVIDER": "fake",
          }
          with open("deploy/.env", "w", encoding="utf-8") as env:
              env.writelines(f"{name}={value}\n" for name, value in values.items())
          EOF
      - name: Subir web (Caddy + SPA), api, analyzer e banco
        run: docker compose -f deploy/compose.yaml up --build -d --wait --wait-timeout 180
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências e o Chromium do Playwright
        working-directory: frontend
        timeout-minutes: 10
        run: |
          # O apt não tem prazo para um download parado: um espelho do Ubuntu travado segurou o
          # deploy de 07/10/2026 por 15 minutos. Com estes limites, ele desiste do espelho em 30 s
          # e tenta de novo; o timeout-minutes do passo é a última barreira.
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "3";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ipc-timeouts > /dev/null
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright (Marco 1 e acesso restrito; a senha vem do deploy/.env)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8180
        run: npm run e2e
      - name: Logs do compose (só em falha)
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color
      - name: Relatório do Playwright (só em falha)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  branch-policy:
    name: main nunca à frente da develop
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Este job é o único que guarda a credencial do checkout: o git fetch da develop precisa dela
      # num repositório privado. Ele não instala nada nem roda código do repositório.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verificar que a main é ancestral da develop
        run: |
          git fetch origin develop
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
            echo "::error::A main tem commits que não estão na develop. Releases são fast-forward da develop."
            exit 1
          fi
