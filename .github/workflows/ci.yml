name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tipos, testes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar Python 3.13 e dependências
        run: |
          uv python install 3.13
          uv sync --locked
      - name: Ruff (lint e segurança)
        run: uv run ruff check .
      - name: Ruff (formatação)
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Fronteiras de arquitetura (import-linter)
        run: uv run lint-imports
      - name: Pytest (motor, API, contrato OpenAPI e cobertura >= 90%)
        run: uv run pytest

  security:
    name: Segurança (isolamento, submissões maliciosas e imagem do piloto)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar Python 3.13 e dependências de teste
        working-directory: backend
        run: |
          uv python install 3.13
          uv sync --locked
      - name: Build da imagem
        run: docker compose -f deploy/compose.yaml build
      - name: Suíte de segurança (DoD, seção 8, itens 2 a 12)
        working-directory: backend
        env:
          IPC_SECURITY_TESTS: "1"
        run: uv run pytest tests/security --no-cov -v

  frontend:
    name: Frontend (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Tipos gerados do OpenAPI em dia (docs/openapi.json -> src/types/openapi.ts)
        run: |
          npm run gen:api
          git diff --exit-code -- src/types/openapi.ts
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Build de produção
        run: npm run build
      - name: Build do piloto (Vercel, com os cabeçalhos de segurança)
        env:
          VITE_API_BASE_URL: https://ip-checker-api.onrender.com
        run: npm run build:vercel

  e2e:
    name: Smoke e2e (compose completo + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Subir web (Caddy + SPA), api e analyzer
        run: docker compose -f deploy/compose.yaml up --build -d --wait --wait-timeout 180
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências e o Chromium do Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright (Marco 1)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8180
        run: npm run e2e
      - name: Logs do compose (só em falha)
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color
      - name: Relatório do Playwright (só em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  branch-policy:
    name: main nunca à frente da develop
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar que a main é ancestral da develop
        run: |
          git fetch origin develop
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
            echo "::error::A main tem commits que não estão na develop. Releases são fast-forward da develop."
            exit 1
          fi
