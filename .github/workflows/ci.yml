name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tipos, testes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar Python 3.13 e dependências
        run: |
          uv python install 3.13
          uv sync --locked
      - name: Ruff (lint e segurança)
        run: uv run ruff check .
      - name: Ruff (formatação)
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Pytest (ruleset, guardas e cobertura >= 90%)
        run: uv run pytest

  security:
    name: Segurança (isolamento e submissões maliciosas contra o contêiner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar Python 3.13 e dependências de teste
        working-directory: backend
        run: |
          uv python install 3.13
          uv sync --locked
      - name: Build da imagem
        run: docker compose -f deploy/compose.yaml build
      - name: Suíte de segurança (DoD, seção 8, itens 2 a 12)
        working-directory: backend
        env:
          IPC_SECURITY_TESTS: "1"
        run: uv run pytest tests/security --no-cov -v

  frontend:
    name: Frontend (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Build de produção
        run: npm run build

  branch-policy:
    name: main nunca à frente da develop
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar que a main é ancestral da develop
        run: |
          git fetch origin develop
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
            echo "::error::A main tem commits que não estão na develop. Releases são fast-forward da develop."
            exit 1
          fi
