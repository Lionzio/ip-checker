name: Deploy do piloto

# Piloto (Fase 1, 2027.1; S11-03, ADR-03; endurecido na S25-02). O deploy sai da main, só depois
# que a CI passa nela (ou à mão, pelo botão "Run workflow", para um commit da main com a CI verde):
# o Render e a Vercel estão com o deploy automático desligado. A ordem é:
#
#   1. instalar as ferramentas, sem nenhum segredo no ambiente;
#   2. conferir que o commit ainda é a ponta da main (os hooks publicam a ponta, não um commit);
#   3. migrar o banco do piloto (as migrações só acrescentam, então servem à versão no ar);
#   4. publicar a API no Render e esperar o /ready com a versão nova;
#   5. só então publicar a página na Vercel e esperar o /version.json;
#   6. conferir o piloto de fora (mesma origem, cabeçalhos, TLS, login) e rodar o smoke e2e.
#
# Se a API não sobe, a página não é publicada: a página nova nunca fica no ar com a API antiga. O
# rollback está em docs/runbook.md.
#
# Configuração no GitHub (Settings > Secrets and variables > Actions), passo a passo em
# deploy/README.md, seção "Piloto":
#   secrets:   RENDER_DEPLOY_HOOK_URL, VERCEL_DEPLOY_HOOK_URL, PILOT_DATABASE_ADMIN_URL,
#              PILOT_DB_API_PASSWORD, PILOT_CHECK_LOGIN, PILOT_CHECK_PASSWORD, PILOT_CHECK_NAME
#   variables: PILOT_API_URL (Render), PILOT_WEB_URL (Vercel)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # O primeiro deploy (ou um novo, depois de configurar as contas) sem esperar outra release.
  workflow_dispatch:

permissions:
  contents: read
  # Para conferir, num disparo manual, que a CI daquele commit passou.
  actions: read

concurrency:
  group: deploy-piloto
  cancel-in-progress: false

jobs:
  not-configured:
    name: Piloto ainda não configurado
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push')) &&
      (vars.PILOT_API_URL == '' || vars.PILOT_WEB_URL == '')
    runs-on: ubuntu-latest
    steps:
      - run: >-
          echo "::warning::Deploy pulado: defina as variáveis PILOT_API_URL e PILOT_WEB_URL e os
          secrets RENDER_DEPLOY_HOOK_URL e VERCEL_DEPLOY_HOOK_URL (deploy/README.md, Piloto)."

  deploy:
    name: Deploy no Render e na Vercel
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push')) &&
      vars.PILOT_API_URL != '' && vars.PILOT_WEB_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
      PILOT_API_URL: ${{ vars.PILOT_API_URL }}
      PILOT_WEB_URL: ${{ vars.PILOT_WEB_URL }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Disparo manual só na main e com a CI verde
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::O deploy manual só roda na main (escolheu $GITHUB_REF)."
            exit 1
          fi
          green=$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$RELEASE&event=push&status=success" \
            -q '[.workflow_runs[] | select(.name == "CI")] | length')
          if [ "$green" = "0" ]; then
            echo "::error::A CI do commit $RELEASE na main não passou (ou ainda não terminou)."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          version: "0.12.21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Nenhum segredo nos passos de instalação: o que as dependências executam ao instalar não
      # enxerga a URL do banco nem as senhas.
      - name: Instalar o backend
        working-directory: backend
        run: |
          uv python install 3.13
          uv sync --locked
      - name: Instalar a página e o Chromium do Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Conferir que o commit ainda é a ponta da main
        run: |
          # Os deploy hooks publicam a ponta da main. Se outra release chegou depois desta, ela tem
          # o próprio deploy na fila (concurrency), e este para aqui sem publicar nada.
          tip=$(gh api "repos/$REPOSITORY/commits/main" -q .sha)
          if [ "$tip" != "$RELEASE" ]; then
            echo "::warning::A main já está em $tip; o deploy de $RELEASE foi pulado em favor dele."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Migrar o banco do piloto (antes de a versão nova subir)
        if: env.SKIP != '1'
        working-directory: backend
        env:
          IPC_DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
          IPC_DB_LOGIN_PASSWORD: ${{ secrets.PILOT_DB_API_PASSWORD }}
        run: |
          # As migrações precisam servir também à versão que ainda está no ar (só acrescentam).
          if [ -z "$IPC_DATABASE_ADMIN_URL" ] || [ -z "$IPC_DB_LOGIN_PASSWORD" ]; then
            echo "::error::Faltam os secrets PILOT_DATABASE_ADMIN_URL e PILOT_DB_API_PASSWORD."
            exit 1
          fi
          uv run --no-sync python -m ipc_api.db.migrate up --login-role ipc_api

      - name: Publicar a API no Render e esperar o /ready com a versão nova
        if: env.SKIP != '1'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Falta o secret RENDER_DEPLOY_HOOK_URL."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" -o /dev/null
          echo "Deploy de $RELEASE pedido ao Render."
          release_of() { curl -fsS --max-time 20 "$1" | python3 -c "import json, sys; print(json.load(sys.stdin).get('release'))" 2>/dev/null; }
          # O build gratuito do Render leva alguns minutos: até 25 min, contados no relógio.
          deadline=$((SECONDS + 1500))
          while [ "$SECONDS" -lt "$deadline" ]; do
            api=$(release_of "$PILOT_API_URL/ready")
            if [ "$api" = "$RELEASE" ]; then
              echo "API no ar com $RELEASE."
              exit 0
            fi
            echo "API em ${api:-?}; aguardando 15 s..."
            sleep 15
          done
          echo "::error::A API não subiu com $RELEASE em 25 minutos; a página não foi publicada. Veja docs/runbook.md."
          exit 1

      - name: Publicar a página na Vercel e esperar o /version.json
        if: env.SKIP != '1'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::Falta o secret VERCEL_DEPLOY_HOOK_URL."
            exit 1
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" -o /dev/null
          echo "Deploy de $RELEASE pedido à Vercel."
          release_of() { curl -fsS --max-time 20 "$1" | python3 -c "import json, sys; print(json.load(sys.stdin).get('release'))" 2>/dev/null; }
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            web=$(release_of "$PILOT_WEB_URL/version.json")
            if [ "$web" = "$RELEASE" ]; then
              echo "Página no ar com $RELEASE."
              exit 0
            fi
            echo "Página em ${web:-?}; aguardando 15 s..."
            sleep 15
          done
          echo "::error::A página não subiu com $RELEASE em 10 minutos. Veja docs/runbook.md."
          exit 1

      - name: Conferir o piloto (mesma origem, cabeçalhos, TLS, login e versão)
        if: env.SKIP != '1'
        working-directory: backend
        env:
          PILOT_RELEASE: ${{ env.RELEASE }}
          PILOT_LOGIN: ${{ secrets.PILOT_CHECK_LOGIN }}
          PILOT_PASSWORD: ${{ secrets.PILOT_CHECK_PASSWORD }}
        run: |
          if [ -z "$PILOT_LOGIN" ] || [ -z "$PILOT_PASSWORD" ]; then
            echo "::error::Faltam os secrets PILOT_CHECK_LOGIN e PILOT_CHECK_PASSWORD (conta ativa usada nas verificações)."
            exit 1
          fi
          uv run --no-sync pytest tests/pilot --no-cov -v

      - name: Smoke e2e no piloto (Playwright)
        if: env.SKIP != '1'
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ env.PILOT_WEB_URL }}
          E2E_TARGET: pilot
          E2E_LOGIN: ${{ secrets.PILOT_CHECK_LOGIN }}
          E2E_PASSWORD: ${{ secrets.PILOT_CHECK_PASSWORD }}
          E2E_NAME: ${{ secrets.PILOT_CHECK_NAME }}
        run: npm run e2e
      - name: Relatório do Playwright (só em falha)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-piloto
          path: frontend/playwright-report
          retention-days: 7
