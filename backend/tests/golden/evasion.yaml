# Corpus de evasão (5.4, ameaça 8): construções indiretas, dinâmicas ou fora do documento.
# Várias dessas violações viram FORA_DA_LISTA quando as Listas 3 a 6 entrarem (Sprints 15 e 16).

- id: E01-getattr
  rule: R-04
  list: 1
  code: |
    x = getattr("a", "upper")()
  expect: [R-02 EXIGENCIA 1, R-04 NAO_CONSTA 1]

- id: E02-eval
  rule: R-04
  list: 1
  code: |
    x = eval("1 + 1")
  expect: [R-02 EXIGENCIA 1, R-04 NAO_CONSTA 1]

- id: E03-exec
  rule: R-04
  list: 1
  code: |
    exec("x = 1")
  expect: [R-02 EXIGENCIA 1, R-04 NAO_CONSTA 1]

- id: E04-dunder-import
  rule: R-04
  list: 1
  code: |
    sistema = __import__("os")
  expect: [R-02 EXIGENCIA 1, R-04 NAO_CONSTA 1]

- id: E05-method-reference-without-call
  rule: R-04
  list: 1
  code: |
    s = input()
    f = s.split
  expect: [R-02 EXIGENCIA 1, R-04 NAO_CONSTA 2]

- id: E06-eval-used-before-shadowing
  rule: R-04
  list: 1
  code: |
    x = eval("1")
    eval = 2
  expect: [R-02 EXIGENCIA 1, R-04 NAO_CONSTA 1]

- id: E07-builtin-aliased-to-allowed-name
  rule: R-04
  list: 1
  code: |
    print = eval
    print("1")
  # Linha 1: eval. Linha 2: print agora é variável do aluno (chamada de função ainda não consta).
  expect: [R-02 EXIGENCIA 1, R-04 NAO_CONSTA 1, R-04 NAO_CONSTA 2]

