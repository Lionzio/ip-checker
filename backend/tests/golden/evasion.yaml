    print(conversor("3"))
  expect: [R-02 EXIGENCIA 1, R-59 FORA_DA_LISTA 2]

- id: E32-match
  rule: R-04
  list: 1
  code: |
    x = 1
    match x:
        case 1:
            print(x)
  expect: [R-02 EXIGENCIA 1, R-04 NAO_CONSTA 2, R-04 NAO_CONSTA 3]

- id: E33-infinite-loop-is-only-parsed
  rule: R-34
  list: 1
  code: |
    while True:
        x = 1
  expect: [R-02 EXIGENCIA 1, R-34 FORA_DA_LISTA 1]

- id: E34-shadowing-inside-condition
  rule: R-04
  list: 1
  code: |
    if True:
        len = eval
    print(len("a"))
  # eval é o built-in na linha 2; na linha 3, len já é variável do aluno (chamada de função).
  expect: [R-04 NAO_CONSTA 2, R-59 FORA_DA_LISTA 3]

- id: E35-decorator
  rule: R-04
  list: 1
  code: |
    @staticmethod
    def f():
        return 1
  # Linha 1: o decorador (built-in e derived:decorator na mesma posição viram uma violação só).
  # Linhas 2 e 3: def e return, que só constam a partir da Lista 4 (Sprint 22).
  expect: [R-02 EXIGENCIA 1, R-04 NAO_CONSTA 1, R-59 FORA_DA_LISTA 2, R-59 FORA_DA_LISTA 3]

- id: E36-student-decorator
  rule: R-04
  list: 1
  code: |
    def d(f):
        return f
    @d
    def g():
        return 1
  # Mesmo com um decorador do próprio aluno, o '@d' da linha 3 gera violação.
  expect: [R-02 EXIGENCIA 1, R-04 NAO_CONSTA 3, R-59 FORA_DA_LISTA 1, R-59 FORA_DA_LISTA 2, R-59 FORA_DA_LISTA 4, R-59 FORA_DA_LISTA 5]

- id: E37-dict-unpacking
  rule: R-04
  list: 1
  code: |
    a = {1: 2}
    b = {**a}
  # O dicionário (R-61, Lista 5) e o '**' dentro dele, que não consta em nenhuma lista.
  expect: [R-02 EXIGENCIA 1, R-61 FORA_DA_LISTA 1, R-61 FORA_DA_LISTA 2, R-04 NAO_CONSTA 2]

- id: E38-builtin-hidden-by-comprehension-target
  rule: R-04
  list: 4
  code: |
    def f(s):
        return [v for map in [map(int, s)] for v in map]
    print(f("12"))
  # O iterável do 1º for de uma compreensão roda fora dela: o map(...) ainda é o built-in.
  expect: [R-04 NAO_CONSTA 2]

- id: E39-eval-hidden-by-comprehension-target
  rule: R-04
  list: 5
  code: |
    d = {}
    x = [eval for eval in eval(input())]
    print(x, d)
  expect: [R-04 NAO_CONSTA 2]

- id: E40-parameter-named-like-the-function
  rule: R-68
  list: 6
  code: |
    def f(f):
        return f(1)
    print(f(abs))
  # f(1) chama o parâmetro, não o def: não há recursão.
  expect: [R-68 EXIGENCIA 1]

- id: E41-builtin-in-default-of-lambda
  rule: R-04
  list: 5
  code: |
    d = {}
    g = lambda eval=eval: eval
    print(g, d)
  # O valor padrão roda fora do lambda, então eval é o built-in. O valor padrão em si (Q-02 f)
  # está na mesma posição e sai na mesma violação R-04.
  expect: [R-04 NAO_CONSTA 2]
