  expect: [R-02 EXIGENCIA 1, R-04 NAO_CONSTA 1]

- id: E05-method-reference-without-call
  rule: R-04
  list: 1
  code: |
    s = input()
    f = s.split
  expect: [R-02 EXIGENCIA 1, R-54 FORA_DA_LISTA 2]

- id: E06-eval-used-before-shadowing
  rule: R-04
  list: 1
  code: |
    x = eval("1")
    eval = 2
