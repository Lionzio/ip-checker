- id: E07-builtin-aliased-to-allowed-name
  rule: R-04
  list: 1
  code: |
    print = eval
    print("1")
  # Linha 1: eval. Linha 2: print agora é variável do aluno (chamada de função ainda não consta).
  expect: [R-02 EXIGENCIA 1, R-04 NAO_CONSTA 1, R-59 FORA_DA_LISTA 2]

