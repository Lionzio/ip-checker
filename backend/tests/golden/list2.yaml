# Corpus golden: permissões da Lista 2 (R-34 a R-37). O zip só vale como o iterável do for, com
# 2 ou mais sequências, e só ele permite vários nomes no for (R-37, Q-02 d, Q-04, US-07).

- id: R-34-for-L2
  rule: R-34
  list: 2
  code: |
    for i in range(3):
        print(i)
  expect: []

- id: R-34-while-before-list-L1
  rule: R-34
  list: 1
  code: |
    x = 3
    while x > 0:
        x -= 1
  expect: [R-02 EXIGENCIA 1, R-34 FORA_DA_LISTA 2]

- id: R-34-for-before-list-L1
  rule: R-34
  list: 1
  code: |
    for c in "abc":
        print(c)
  expect: [R-02 EXIGENCIA 1, R-34 FORA_DA_LISTA 1]

- id: R-34-while-L6
  rule: R-34
  list: 6
  code: |
    x = 0
    while x < 3:
        x += 1
  expect: [R-68 EXIGENCIA 1]

- id: R-35-range-L2
  rule: R-35
  list: 2
  code: |
    for i in range(1, 10, 2):
        print(i)
  expect: []

- id: R-35-range-before-list-L1
  rule: R-35
  list: 1
  code: |
    x = range(3)
  expect: [R-02 EXIGENCIA 1, R-35 FORA_DA_LISTA 1]

- id: R-35-for-range-before-list-L1
  rule: R-35
  list: 1
  code: |
    for i in range(3):
        print(i)
  expect: [R-02 EXIGENCIA 1, R-34 FORA_DA_LISTA 1, R-35 FORA_DA_LISTA 1]

- id: R-36-in-range-L2
  rule: R-36
  list: 2
  code: |
    x = int(input())
    if x in range(1, 11):
        print("entre 1 e 10")
  expect: [R-02 EXIGENCIA 1]

- id: R-36-in-range-before-list-L1
  rule: R-36
  list: 1
  code: |
    print(3 in range(5))
  # O in já é permitido na Lista 1 (R-30); o range() ainda não.
  expect: [R-02 EXIGENCIA 1, R-35 FORA_DA_LISTA 1]

- id: R-36-not-in-range-L6
  rule: R-36
  list: 6
  code: |
    print(7 not in range(5))
  expect: [R-68 EXIGENCIA 1]

- id: R-37-zip-in-for-header-L2
  rule: R-37
  list: 2
  code: |
    nomes = input()
    notas = input()
    for a, b in zip(nomes, notas):
        print(a, b)
  expect: []

- id: R-37-zip-three-sequences-L2
  rule: R-37
  list: 2
  code: |
    x = input()
    y = input()
    w = input()
    for a, b, c in zip(x, y, w):
        print(a, b, c)
  expect: []

- id: R-37-zip-outside-for-L2
  rule: R-37
  list: 2
  code: |
    a = input()
    b = input()
    z = zip(a, b)
    for par in z:
        print(par)
  expect: [R-37 NAO_CONSTA 3]

- id: R-37-zip-one-sequence-L2
  rule: R-37
  list: 2
  code: |
    texto = input()
    for a, b in zip(texto):
        print(a, b)
  expect: [R-37 NAO_CONSTA 2, R-37 NAO_CONSTA 2]

- id: R-37-unpack-without-zip-L2
  rule: R-37
  list: 2
  code: |
    texto = input()
    for a, b in texto:
        print(a, b)
  expect: [R-37 NAO_CONSTA 2]

- id: R-37-zip-nested-in-header-L2
  rule: R-37
  list: 2
  code: |
    x = input()
    y = input()
    for a, b in zip(zip(x, y), y):
        print(a, b)
  expect: [R-37 NAO_CONSTA 3]

- id: R-37-zip-before-list-L1
  rule: R-37
  list: 1
  code: |
    x = input()
    y = input()
    for a, b in zip(x, y):
        print(a, b)
  expect: [R-02 EXIGENCIA 1, R-34 FORA_DA_LISTA 3, R-37 FORA_DA_LISTA 3, R-37 FORA_DA_LISTA 3]

- id: R-37-zip-outside-for-L4
  rule: R-37
  list: 4
  code: |
    a = input()
    b = input()
    z = zip(a, b)
