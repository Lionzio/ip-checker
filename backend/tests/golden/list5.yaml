- id: R-63-enumerate-before-list-L4
  rule: R-63
  list: 4
  code: |
    def mostra(v):
        for i, x in enumerate(v):
            print(i, x)
    mostra([1])
  # Vários nomes no for valem desde a Lista 3 (R-40, caso 3 do Marco 2); enumerate() é da Lista 5.
  expect: [R-63 FORA_DA_LISTA 2]

- id: R-63-enumerate-start-keyword-L5
