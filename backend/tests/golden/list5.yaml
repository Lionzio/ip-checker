# Corpus golden: permissões da Lista 5, dicionários (R-61 a R-67). Todo código da Lista 5 precisa
# de um dicionário, literal ou dict() (R-02, Q-05). zip() é livre a partir daqui (R-64, Q-04); o
# alvo "a, b" do for só é permitido quando o for percorre zip(), enumerate() ou .items().
# Dict comprehension (Q-02 e), key= (Q-02 c) e valor padrão de parâmetro (Q-02 f) seguem na R-04.

- id: R-61-dict-literal-L5
  rule: R-61
  list: 5
  code: |
    notas = {"ana": 7.5}
    notas["bia"] = 8.0
    print(notas["ana"], len(notas))
  expect: []

- id: R-61-nested-dict-and-in-L5
  rule: R-61
  list: 5
  code: |
    agenda = {"ana": {"tel": "9999"}}
    if "ana" in agenda:
        del agenda["ana"]
    print(agenda)
  expect: []

- id: R-61-dict-before-list-L4
  rule: R-61
  list: 4
  code: |
    def cria():
        return {"a": 1}
    print(cria())
  expect: [R-61 FORA_DA_LISTA 2]

- id: R-61-dict-comprehension-L5
  rule: R-61
  list: 5
  code: |
    dobros = {x: x * 2 for x in range(3)}
    print(dobros)
  # Dict comprehension não consta (Q-02 e) e também não comprova o assunto da Lista 5.
  expect: [R-02 EXIGENCIA 1, R-04 NAO_CONSTA 1]

- id: R-61-dict-unpacking-L5
  rule: R-61
  list: 5
  code: |
    a = {1: 2}
    b = {**a}
    print(b)
  expect: [R-04 NAO_CONSTA 2]

