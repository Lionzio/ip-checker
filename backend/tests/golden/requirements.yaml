# Corpus golden: exigências (R-02, Q-05). A solução precisa usar o assunto da lista; sem ele, a
# solução inteira recebe EXIGENCIA (linha 1). Lista 1: if (com ou sem elif/else) ou ternário;
# Lista 2: for ou while; Lista 3: lista ou tupla (literal, list(), tuple() ou list comprehension);
# Lista 4: def; Lista 5: dicionário (literal ou dict()); Lista 6: recursão direta ou mútua (R-68, C-03).

- id: R-02-without-conditional-L1
  rule: R-02
  list: 1
  code: |
    n = int(input())
    print(n * 2)
  expect: [R-02 EXIGENCIA 1]

- id: R-02-if-satisfies-L1
  rule: R-02
  list: 1
  code: |
    n = int(input())
    if n % 2 == 0:
        print("par")
  expect: []

- id: R-02-if-elif-else-satisfies-L1
  rule: R-02
  list: 1
  code: |
    nota = float(input())
    if nota >= 7:
        print("Aprovado")
    elif nota >= 3:
        print("Final")
    else:
        print("Reprovado")
  expect: []

