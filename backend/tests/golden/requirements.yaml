- id: R-02-if-does-not-hide-a-general-prohibition-L1
  rule: R-02
  list: 1
  code: |
    try:
        x = int(input())
        if x > 0:
            print(x)
    except ValueError:
        print("inválido")
  # A exigência está cumprida, mas o try anula a questão do mesmo jeito.
  expect: [R-06 ANULACAO 1, R-04 NAO_CONSTA 5]

- id: R-02-loop-without-if-L1
