- id: R-02-if-deep-in-the-code-satisfies-L1
  rule: R-02
  list: 1
  code: |
    a = int(input())
    b = int(input())
    c = a + b
    d = c * 2
    resultado = "alto" if d > 10 else "baixo"
    print(resultado)
