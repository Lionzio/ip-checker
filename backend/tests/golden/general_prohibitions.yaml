  expect: [R-09 ANULACAO 1]

- id: R-09-type-three-arguments-L1
  rule: R-09
  list: 1
  code: |
    C = type("C", (), {})
  # type com 3 argumentos cria classe (Q-07); a tupla e o dicionário ainda não constam.
  expect: [R-09 ANULACAO 1, R-04 NAO_CONSTA 1, R-04 NAO_CONSTA 1]

- id: R-09-class-L6
  rule: R-09
  list: 6
  code: |
    class Vazia:
        x = 1
  expect: [R-09 ANULACAO 1]

- id: R-10-star-in-call-L1
  rule: R-10
  list: 1
  code: |
    print(*"ab")
  expect: [R-10 ANULACAO 1]

- id: R-10-double-star-in-call-L1
  rule: R-10
  list: 1
  code: |
    print("a", **{"end": ""})
  # O dicionário ainda não consta (R-04).
  expect: [R-10 ANULACAO 1, R-04 NAO_CONSTA 1]

- id: R-10-kwargs-in-lambda-L1
  rule: R-10
  list: 1
  code: |
    f = lambda **extras: 1
  # lambda ainda não consta (R-04); **extras é R-10.
  expect: [R-04 NAO_CONSTA 1, R-10 ANULACAO 1]

