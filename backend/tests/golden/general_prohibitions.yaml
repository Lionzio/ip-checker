# Corpus golden: proibições gerais (R-05 a R-14). Valem em todas as listas e anulam a questão.
# Formato de "expect": "R-xx CATEGORIA linha". A comparação é exata (NFR-18).

- id: R-05-import-L1
  rule: R-05
  list: 1
  code: |
    import math
  expect: [R-05 ANULACAO 1]

- id: R-05-from-import-L2
  rule: R-05
  list: 2
  code: |
    from math import sqrt
  expect: [R-05 ANULACAO 1]

- id: R-05-import-alias-L6
  rule: R-05
  list: 6
  code: |
    x = 1
    import os as sistema
  expect: [R-05 ANULACAO 2]

- id: R-06-try-except-L1
  rule: R-06
  list: 1
  code: |
    try:
        x = int(input())
    except:
        x = 0
  expect: [R-06 ANULACAO 1]

- id: R-06-try-except-L2
  rule: R-06
  list: 2
  code: |
    x = 0
    try:
        x = int(input())
    except:
        x = 1
  expect: [R-06 ANULACAO 2]

- id: R-06-try-finally-L6
  rule: R-06
  list: 6
  code: |
    try:
        x = 1
    finally:
        x = 2
  expect: [R-06 ANULACAO 1]

