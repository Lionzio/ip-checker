# Corpus golden: permissões da Lista 4, funções e escopo de variável (R-59 e R-60). Todo código da
# Lista 4 precisa de um def (R-02, Q-05). Parâmetro com valor padrão e função dentro de função não
# constam (Q-02 f); argumento nomeado na chamada e if __name__ são permitidos (casos 1 e 2 do Marco 2).

- id: R-59-def-return-L4
  rule: R-59
  list: 4
  code: |
    def dobro(x):
        return x * 2
    print(dobro(int(input())))
  expect: []

- id: R-59-def-without-return-L4
  rule: R-59
  list: 4
  code: |
    def mostra(texto):
        print(texto)
    mostra(input())
  expect: []

- id: R-68-direct-recursion-before-list-L4
  rule: R-68
  list: 4
  # Q-33 (S36-09): a recursão só é permitida a partir da Lista 6; o def e a chamada seguem da R-59.
  code: |
    def fat(n):
        if n <= 1:
            return 1
        return n * fat(n - 1)
    print(fat(5))
  expect: [R-68 FORA_DA_LISTA 1]

- id: R-59-function-calling-another-L4
  rule: R-59
  list: 4
  # Uma função que chama outra, sem ciclo, continua permitida na Lista 4.
  code: |
    def dobro(n):
        return 2 * n
    def quadruplo(n):
        return dobro(dobro(n))
    print(quadruplo(5))
  expect: []

- id: R-59-def-before-list-L3
  rule: R-59
  list: 3
  code: |
    def soma(v):
        return sum(v)
    print(soma([1, 2]))
  expect: [R-59 FORA_DA_LISTA 1, R-59 FORA_DA_LISTA 2, R-59 FORA_DA_LISTA 3]

- id: R-59-default-parameter-L4
  rule: R-59
