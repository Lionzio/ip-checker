  - nome: independentes_frequencia
    descricao: "Lista 5: frequência de palavras com get e com if/else; não pode parecer plágio."
    maximo: 79.9
    a: |
      palavras = input().split()
      frequencia = {}
      for p in palavras:
          frequencia[p] = frequencia.get(p, 0) + 1
      for p, n in frequencia.items():
          print(p, n)
    b: |
      texto = input()
      contagem = dict()
      lista = texto.split(" ")
      i = 0
      while i < len(lista):
          w = lista[i]
          if w in contagem:
              contagem[w] += 1
          else:
              contagem[w] = 1
          i += 1
      maior = max(contagem, key=contagem.get)
      print("Mais frequente:", maior, contagem[maior])

