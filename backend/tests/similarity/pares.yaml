# Corpus de pares do detector de plágio (S17-01, NFR-25, ADR-05).
#
# Cada par tem dois códigos (a e b) e a faixa esperada de similaridade, em porcentagem:
#   minimo / maximo: limites inclusivos; exato: valor exato.
# Os pesos, o k e a janela do winnowing (engine/similarity.py) e as camadas da árvore canonizada
# (engine/similarity_tree.py, ADR-07) só mudam junto com este corpus. Desde a Sprint 27, cada
# reescrita da tabela da ADR-07 tem um par com mínimo de 95%, e soluções independentes de cada
# lista ficam abaixo de 80%.
# Os códigos imitam soluções reais das listas; nenhum deles é de um aluno.

pares:
  - nome: variaveis_renomeadas
    descricao: Cópia em que só os nomes do aluno mudaram (NFR-25, ≥ 99%).
    minimo: 99.0
    a: |
      lado1 = float(input())
      lado2 = float(input())
      lado3 = float(input())
      if lado1 + lado2 > lado3 and lado1 + lado3 > lado2 and lado2 + lado3 > lado1:
          if lado1 == lado2 == lado3:
              tipo = "equilatero"
          elif lado1 == lado2 or lado1 == lado3 or lado2 == lado3:
              tipo = "isosceles"
          else:
              tipo = "escaleno"
          print(f"Triangulo {tipo}")
      else:
          print("Nao forma triangulo")
    b: |
      x = float(input())
      y = float(input())
      z = float(input())
      if x + y > z and x + z > y and y + z > x:
          if x == y == z:
              classe = "equilatero"
          elif x == y or x == z or y == z:
              classe = "isosceles"
          else:
              classe = "escaleno"
          print(f"Triangulo {classe}")
      else:
          print("Nao forma triangulo")

