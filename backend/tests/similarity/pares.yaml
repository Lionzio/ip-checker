      def calcula(lista):
          n = 0
          total = 0
          k = 0
          while k < len(lista):
              total = total + lista[k]
              n = n + 1
              k += 1
          if 0 != n:
              return total / n
          else:
              return 0

      entrada = [float(t) for t in input().split()]
      m = calcula(entrada)
      if 7 > m:
          print("Reprovado", m)
      else:
          print("Aprovado", m)

