[project]
name = "ipc-backend"
version = "0.1.0"
description = "IP-Checker: verificação estática das regras de permissão das listas de Introdução à Programação"
readme = "README.md"
# A gramática do analisador acompanha a versão do Dikastis (Q-01, NFR-21).
requires-python = ">=3.13,<3.14"
dependencies = [
  "argon2-cffi>=25.1",
  "asyncpg>=0.30",
  "authlib>=1.8.0",
  "fastapi>=0.142.2",
  "httpx2>=2.13.1",
  "pebble>=5.2.2",
  "pydantic>=2.10,<3",
  # Filtro seccomp dos workers (S11-01). Só funciona em Linux, onde existe a libseccomp.
  "pyseccomp>=0.1.2; sys_platform == 'linux'",
  "pyyaml>=6.0.2,<7",
  "structlog>=25.1",
  "uvicorn>=0.54.0",
]

[project.scripts]
# Valida o ruleset do período ativo (FR-21, US-14): uv run ipc-rules validate ../rulesets
ipc-rules = "ipc_analyzer.cli:main"

[dependency-groups]
dev = [
  "import-linter>=2.15",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.9",
  "schemathesis>=4.28.0",
  "types-pyyaml>=6.0.12",
]
pilot = [
    "supervisor>=4.3.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ipc_analyzer", "src/ipc_api"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# S = regras de segurança (bandit): bloqueiam eval, exec, pickle, subprocess etc. (NFR-09)
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
# Nos testes, senhas fixas são valores de teste (S105, S106), nunca credenciais reais.
"tests/**" = ["S101", "S105", "S106"]
# Os caminhos /tmp, /var/tmp e /dev/shm da suíte de segurança são do contêiner, não desta máquina.
"tests/security/**" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.13"
# A produção roda em Linux; assim o mypy também confere o código que só existe lá (resource).
platform = "linux"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=ipc_analyzer --cov=ipc_api --cov-report=term-missing --cov-fail-under=90"
# S39-03: os testes do PostgreSQL recriam o esquema a cada teste no mesmo banco, e os de tempo medem
# o relógio; os dois grupos rodam em série (`-m "db or timing"`), e o resto em paralelo
# (`-n 4 -m "not db and not timing"`) na CI local. O `db` entra sozinho em todo módulo que usa o
# `db_support` (conftest.py); o `timing` é posto à mão em cada teste que mede o relógio.
markers = [
  "db: usa o PostgreSQL de teste (IPC_TEST_DATABASE_URL); roda em série",
  "timing: mede o tempo de relógio; roda em série, para não dividir a máquina com outros testes",
]

# Fronteiras de arquitetura verificadas na CI (NFR-09, DoD): `uv run lint-imports`.
[tool.importlinter]
root_packages = ["ipc_api", "ipc_analyzer"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "A API nunca analisa código: ipc_api não importa ast"
type = "forbidden"
source_modules = ["ipc_api"]
forbidden_modules = ["ast"]

[[tool.importlinter.contracts]]
name = "API e analyzer são serviços separados: só conversam por HTTP"
type = "independence"
modules = ["ipc_api", "ipc_analyzer"]

[[tool.importlinter.contracts]]
name = "O motor de regras é puro: não importa o serviço, o pool nem frameworks web"
type = "forbidden"
source_modules = ["ipc_analyzer.engine"]
forbidden_modules = ["ipc_analyzer.service", "ipc_analyzer.runtime", "fastapi", "starlette", "uvicorn", "pebble", "httpx2"]

[[tool.importlinter.contracts]]
name = "O analyzer não tem banco nem senhas: não importa asyncpg nem argon2"
type = "forbidden"
source_modules = ["ipc_analyzer"]
forbidden_modules = ["asyncpg", "argon2"]

[[tool.mypy.overrides]]
# pyseccomp não publica tipos; o uso fica restrito a ipc_analyzer/runtime/sandbox.py.
module = ["pyseccomp"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# asyncpg não publica tipos; o uso fica restrito a ipc_api/accounts/postgres.py e ipc_api/db/.
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
