# Piloto (Fase 1, 2027.1; ADR-03, S11-01): Blueprint do Render para o backend.
#
# Um único serviço Docker, com a API e o analisador isolados por processo (deploy/render/). O deploy
# nunca é automático a cada push: o pipeline (.github/workflows/deploy.yml) chama o deploy hook
# depois que a CI passa na main. Passo a passo da criação em deploy/piloto.md.
services:
  - type: web
    name: ip-checker-api
    runtime: docker
    plan: free
    # Leste dos EUA: a região do Render mais próxima de Recife.
    region: virginia
    branch: main
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    # O Render só troca a versão no ar quando a nova responde /health/service (API e analisador
    # prontos). O banco fica de fora (S25-02): uma oscilação do Supabase não derruba a instância;
    # o /ready, com o banco, continua no UptimeRobot e no pipeline de deploy.
    healthCheckPath: /health/service
    # Os valores com "sync: false" são definidos no painel do Render (Environment), nunca no Git.
    envVars:
      # Endereço da página na Vercel. A Vercel repassa /api/* para cá (S16-02, ADR-04): é a origem
      # aceita nas requisições que mudam estado, a base do link do e-mail e do retorno do Google.
      - key: IPC_PUBLIC_BASE_URL
        sync: false
      - key: IPC_HSTS
        value: "1"
      # EXERCÍCIO DE ALERTA (S30-05), TEMPORÁRIO: meta de 50 ms para o /health/slo responder 503
      # com a carga de 20 por minuto e o UptimeRobot avisar. Sai no PR de fechamento da Sprint 30;
      # o padrão é 200 ms (NFR-15).
      - key: IPC_SLO_P95_MS
        value: "50"
      # Indícios de uso de IA (ADR-08, S29): desligados no piloto até a coordenação aprovar a
      # política (S29-04, docs/indicios-de-ia.md). Ligar é trocar para "1" aqui, por PR.
      - key: IPC_AI_INDICATORS
        value: "0"
      - key: IPC_ENABLED_LISTS
        value: "1,2,3,4,5,6"
      # Pela página, o X-Forwarded-For chega com o cliente (escrito pela Vercel), o IP da Vercel e
      # as entradas da borda do Render: o cliente é a 4ª entrada a partir do fim. Direto no Render,
      # há menos entradas, e a primeira é o cliente (S30-03). Com "2", o limite por IP pegava um
      # proxy interno do Render, diferente a cada requisição, e não limitava ninguém (08/10/2026).
      # [PREMISSA P-15 b: conferida pelo teste do limite em tests/pilot, depois do deploy.]
      - key: IPC_TRUSTED_PROXY_HOPS
        value: "4"
      # Quem chama o Render direto pode forjar a 4ª entrada do X-Forwarded-For (o Render acrescenta
      # sem limpar). Sem sessão, um segundo limite por IP usa o que o Cloudflare do Render escreve,
      # que o cliente não forja (S30-03, medido em 08/10/2026 com /api/v1/proxy-check).
      - key: IPC_RATE_LIMIT_EDGE_HEADER
        value: cf-connecting-ip
      # Pela página, o X-Forwarded-For às vezes chega com o valor forjado pelo cliente (depende do
      # nó da Vercel), mas o "Forwarded: for=" sempre traz o IP real: ele vem antes (S30-03).
      - key: IPC_TRUST_FORWARDED_HEADER
        value: "1"
      # Banco de contas (Supabase), com o usuário ipc_api criado pela migração do pipeline.
      - key: IPC_DATABASE_URL
        sync: false
      # Senha inicial da conta do desenvolvedor; só vale na criação da conta.
      - key: IPC_DEV_INITIAL_PASSWORD
        sync: false
      # E-mail de verificação: o plano gratuito do Render bloqueia SMTP de saída (Q-17).
      - key: IPC_EMAIL_TRANSPORT
        value: brevo
      - key: IPC_EMAIL_API_KEY
        sync: false
      - key: IPC_EMAIL_FROM
        sync: false
      # Entrada pelo Google (S16-01); sem os dois, o botão do Google não aparece.
      - key: IPC_GOOGLE_CLIENT_ID
        sync: false
      - key: IPC_GOOGLE_CLIENT_SECRET
        sync: false
      # Feedback por IA (S18): a principal e a de reserva. Vazias, o feedback é montado sem IA.
      - key: IPC_LLM_PROVIDER
        sync: false
      - key: IPC_LLM_BASE_URL
        sync: false
      - key: IPC_LLM_MODEL
        sync: false
      - key: IPC_LLM_API_KEY
        sync: false
      - key: IPC_LLM_FALLBACK_PROVIDER
        sync: false
      - key: IPC_LLM_FALLBACK_BASE_URL
        sync: false
      - key: IPC_LLM_FALLBACK_MODEL
        sync: false
      - key: IPC_LLM_FALLBACK_API_KEY
        sync: false
      - key: IPC_RATE_LIMIT_CAMPUS_CIDRS
        value: 150.161.0.0/16
