; Piloto no Render (Fase 1, 2027.1; S11-01, ADR-03). O Render roda um único contêiner, sem rede
; interna nem flags de contêiner: o isolamento entre a API e o analisador é feito por processo.
;
; - O supervisord é o único processo como root, só para iniciar cada serviço com o próprio usuário.
;   Não abre socket de controle (não há supervisorctl).
; - api (UID 10001): recebe a porta pública do Render ($PORT) e as variáveis do painel.
; - analyzer (UID 10002): ambiente vazio (env -i), escuta só em 127.0.0.1 e roda as análises em
;   workers com seccomp, sem sockets de rede nem execve (IPC_SANDBOX=required).
;
; O UID 10002 não lê /proc/<pid>/environ da API nem do supervisord: o kernel só permite ao dono.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=warn

[program:analyzer]
command=/usr/bin/env -i
    PATH=/opt/venv/bin:/usr/local/bin:/usr/bin:/bin
    PYTHONDONTWRITEBYTECODE=1
    PYTHONUNBUFFERED=1
    IPC_RULESET_PATH=/opt/ip-checker/rulesets/2026.2/base.yaml
    IPC_SANDBOX=required
    IPC_MEMORY_MB=160
    /opt/venv/bin/uvicorn ipc_analyzer.service.app:create_app --factory
    --host 127.0.0.1 --port 8001 --no-server-header --no-proxy-headers
user=ipc-analyzer
directory=/opt/ip-checker
priority=10
autorestart=true
startsecs=10
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:api]
command=/opt/venv/bin/uvicorn ipc_api.app:create_app --factory
    --host 0.0.0.0 --port %(ENV_PORT)s --no-server-header --no-proxy-headers
user=ipc-api
directory=/opt/ip-checker
environment=HOME="/nonexistent",IPC_ANALYZER_URL="http://127.0.0.1:8001"
priority=20
autorestart=true
startsecs=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
