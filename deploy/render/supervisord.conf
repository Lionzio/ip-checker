; Piloto no Render (Fase 1, 2027.1; S11-01, ADR-03). O Render roda um único contêiner, sem rede
; interna nem flags de contêiner: o isolamento entre a API e o analisador é feito por processo.
;
; - O supervisord é root, só para iniciar cada serviço com o próprio usuário, por um lançador
;   (/etc/ipc/run_as.py, também root, um por serviço). Não abre socket de controle (não há
;   supervisorctl).
; - Desligamento sem CAP_KILL (S30-10, P-17): o Render não dá essa capacidade, e um root sem ela não
;   sinaliza processos de outro usuário. O supervisord sinaliza só o lançador (root); o lançador
;   fecha um pipe, e um guardião com o usuário do serviço o encerra (detalhes em run_as.py). Por
;   isso stopasgroup e killasgroup ficam desligados: sinalizar o grupo alcançaria o serviço direto
;   e daria PermissionError.
; - O env -i do analisador vem antes do lançador: nenhum processo com o UID 10002 recebe as
;   variáveis do painel.
; - api (UID 10001): recebe a porta pública do Render ($PORT) e as variáveis do painel.
; - analyzer (UID 10002): ambiente vazio (env -i), escuta só em 127.0.0.1 e roda as análises em
;   workers com seccomp, sem sockets de rede nem execve (IPC_SANDBOX=required).
;
; - Plano gratuito (S25-04): 0,1 CPU e 512 MB. Um worker só, e a API admite uma análise por vez
;   (admissão igual ao número de workers); as demais esperam até 1 s ou recebem OVERLOADED.
;
; O UID 10002 não lê /proc/<pid>/environ da API nem do supervisord: o kernel só permite ao dono.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=warn

[program:analyzer]
command=/usr/bin/env -i
    PATH=/opt/venv/bin:/usr/local/bin:/usr/bin:/bin
    PYTHONDONTWRITEBYTECODE=1
    PYTHONUNBUFFERED=1
    IPC_RULESET_PATH=/opt/ip-checker/rulesets/2026.2/base.yaml
    IPC_SANDBOX=required
    IPC_MEMORY_MB=160
    IPC_WORKERS=1
    /usr/local/bin/python3 -I -S /etc/ipc/run_as.py ipc-analyzer --
    /opt/venv/bin/uvicorn ipc_analyzer.service.app:create_app --factory
    --host 127.0.0.1 --port 8001 --no-server-header --no-proxy-headers
directory=/opt/ip-checker
priority=10
autorestart=true
startsecs=10
stopwaitsecs=15
stopasgroup=false
killasgroup=false
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:api]
command=/usr/local/bin/python3 -I -S /etc/ipc/run_as.py ipc-api -- /opt/venv/bin/uvicorn ipc_api.app:create_app --factory
    --host 0.0.0.0 --port %(ENV_PORT)s --no-server-header --no-proxy-headers
directory=/opt/ip-checker
environment=HOME="/nonexistent",IPC_ANALYZER_URL="http://127.0.0.1:8001",IPC_ADMISSION_CAPACITY="1"
priority=20
autorestart=true
startsecs=5
stopwaitsecs=15
stopasgroup=false
killasgroup=false
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
