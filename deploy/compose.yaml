# Fase 0 (local) e Fase 2 (servidor do CIn): Docker Compose (ADR-03).
#
# web (S9-02): o Caddy serve a SPA e repassa /api/* à api, na mesma origem. É a única porta
# publicada: 8180, só em 127.0.0.1.
# api (S8-01): fala com o analyzer pela analyzer_net e com o Caddy pela edge_net; sem porta própria.
# analyzer (S6-01): só na analyzer_net, sem porta publicada nem rota para fora. Cada controle é
# conferido por backend/tests/security/test_isolation.py (NFR-07).
# db e migrate (S13-01): o banco de contas e sessões, só na db_net (sem porta publicada e sem saída
# para a internet), e a aplicação das migrações a cada subida, com a credencial de administrador.
#
# As senhas vêm de deploy/.env (fora do Git; modelo em deploy/.env.example):
#
#     docker compose -f deploy/compose.yaml up --build -d --wait

name: ip-checker

services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    # O usuário postgres da imagem, sem passar pelo root: nenhuma capability é necessária.
    user: "70:70"
    environment:
      POSTGRES_DB: ipchecker
      POSTGRES_PASSWORD: ${IPC_DB_ADMIN_PASSWORD:?defina IPC_DB_ADMIN_PASSWORD em deploy/.env}
    volumes:
      - db_data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /var/run/postgresql:size=1m,mode=1777,noexec,nosuid,nodev
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "ipchecker"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 20
    # Sem "ports": o banco não disputa a 5432 nem a 6432 com outros projetos desta máquina.
    networks: [db_net]
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ip-checker-backend:local
    command: [python, -m, ipc_api.db.migrate, up, --login-role, ipc_api]
    environment:
      # A credencial de administrador só existe neste contêiner de vida curta, nunca na api.
      IPC_DATABASE_ADMIN_URL: postgresql://postgres:${IPC_DB_ADMIN_PASSWORD}@db:5432/ipchecker
      IPC_DB_LOGIN_PASSWORD: ${IPC_DB_API_PASSWORD:?defina IPC_DB_API_PASSWORD em deploy/.env}
      # Só este serviço precisa das migrações; o analyzer e a api não recebem a variável.
      IPC_MIGRATIONS_DIR: /opt/ip-checker/database/migrations
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 128m
    memswap_limit: 128m
    depends_on:
      db:
        condition: service_healthy
    networks: [db_net]
    restart: "no"

  analyzer:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    # A mesma imagem roda os dois serviços; cada um usa o seu comando.
    image: ip-checker-backend:local
    user: "10001:10001"
    # Raiz do sistema de arquivos só leitura. O /tmp em memória existe porque o forkserver do pool
    # cria ali o socket pelo qual nascem os workers; noexec impede executar o que for gravado.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    # /dev/shm guarda os semáforos do pool; o Docker já o monta com noexec, aqui só encolhe.
    shm_size: 16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    # Igual ao mem_limit: sem swap, a memória total do contêiner fica em 512 MB.
    memswap_limit: 512m
    # Um init mínimo como PID 1 repassa sinais e recolhe processos órfãos dos workers mortos.
    init: true
    # Sem "ports": nada é publicado na máquina, então o analyzer não disputa portas com outros
    # projetos. Só quem está na analyzer_net o alcança, em analyzer:8001.
    networks: [analyzer_net]
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ip-checker-backend:local
    command:
      - uvicorn
      - ipc_api.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-server-header
      # Só a própria API interpreta o X-Forwarded-For (IPC_TRUSTED_PROXY_HOPS).
      - --no-proxy-headers
    environment:
      IPC_ANALYZER_URL: http://analyzer:8001
      IPC_ENABLED_LISTS: "1,2,3,4,5,6"
      # Limite de taxa (FR-19). Há um proxy confiável na frente da API, o Caddy: o IP do
      # cliente é o último endereço do X-Forwarded-For, que o Caddy escreve.
      IPC_TRUSTED_PROXY_HOPS: "1"
      # Faixa da UFPE (Q-11): limite por IP de 1.000/min, em vez de 120/min.
      IPC_RATE_LIMIT_CAMPUS_CIDRS: 150.161.0.0/16
      # Banco de contas (S13-01), com o usuário da API, que não altera o esquema nem apaga contas.
      IPC_DATABASE_URL: postgresql://ipc_api:${IPC_DB_API_PASSWORD}@db:5432/ipchecker
      # Senha inicial da conta do desenvolvedor (P-14): usada só na criação da conta.
      IPC_DEV_INITIAL_PASSWORD: ${IPC_DEV_INITIAL_PASSWORD:?defina IPC_DEV_INITIAL_PASSWORD em deploy/.env}
      # E-mail de verificação (S14-02). Sem nada no deploy/.env, o Mailpit captura tudo, sem
      # enviar nada para fora (o padrão dos testes e da CI). Para entregar de verdade (Gmail,
      # Outlook...), o deploy/.env troca o transporte: SMTP de uma conta (ex.: Gmail com senha de
      # app) ou a API HTTPS do Brevo, o mesmo do piloto (Q-17; passo a passo no deploy/compose.md).
      IPC_EMAIL_TRANSPORT: ${IPC_EMAIL_TRANSPORT:-smtp}
      IPC_SMTP_HOST: ${IPC_SMTP_HOST:-mailpit}
      IPC_SMTP_PORT: ${IPC_SMTP_PORT:-1025}
      IPC_SMTP_SECURITY: ${IPC_SMTP_SECURITY:-none}
      IPC_SMTP_USERNAME: ${IPC_SMTP_USERNAME:-}
      IPC_SMTP_PASSWORD: ${IPC_SMTP_PASSWORD:-}
      IPC_EMAIL_API_KEY: ${IPC_EMAIL_API_KEY:-}
      IPC_EMAIL_FROM: ${IPC_EMAIL_FROM:-IP-Checker <nao-responda@ip-checker.local>}
      # De onde sai o link do e-mail; nunca do Host da requisição (ameaça 21). Localmente, o link
      # só abre na própria máquina: para a equipe, ele precisa ser o endereço público do piloto.
      IPC_PUBLIC_BASE_URL: ${IPC_PUBLIC_BASE_URL:-http://127.0.0.1:${IPC_HTTP_PORT:-8180}}
      # Indícios de uso de IA (ADR-08, S29): ligados no ambiente local, na CI e no e2e; no
      # piloto, só com a política aprovada (render.yaml).
      IPC_AI_INDICATORS: ${IPC_AI_INDICATORS:-1}
      # Feedback (S18): IA principal e de reserva, do deploy/.env. Vazias, o feedback é montado
      # por modelos de texto, sem IA. Só a api recebe as chaves; o analyzer nunca.
      IPC_LLM_PROVIDER: ${IPC_LLM_PROVIDER:-}
      IPC_LLM_BASE_URL: ${IPC_LLM_BASE_URL:-}
      IPC_LLM_MODEL: ${IPC_LLM_MODEL:-}
      IPC_LLM_API_KEY: ${IPC_LLM_API_KEY:-}
      IPC_LLM_FALLBACK_PROVIDER: ${IPC_LLM_FALLBACK_PROVIDER:-}
      IPC_LLM_FALLBACK_BASE_URL: ${IPC_LLM_FALLBACK_BASE_URL:-}
      IPC_LLM_FALLBACK_MODEL: ${IPC_LLM_FALLBACK_MODEL:-}
      IPC_LLM_FALLBACK_API_KEY: ${IPC_LLM_FALLBACK_API_KEY:-}
      # Alertas em /health/slo (S21-02): P95 da verificação e taxa de 5xx nos últimos 5 minutos.
      # Mudar só no exercício de falha (deploy/compose.md, "Telemetria e alertas").
      IPC_SLO_P95_MS: ${IPC_SLO_P95_MS:-200}
      IPC_SLO_MIN_REQUESTS: ${IPC_SLO_MIN_REQUESTS:-20}
      # Gabaritos (ADR-11, Sprint 32): no piloto, a API os baixa do repositório privado e os
      # guarda só em memória; aqui, ela lê uma pasta montada só para leitura. O padrão são os
      # gabaritos sintéticos do e2e; o deploy/.env pode apontar para o clone dos oficiais.
      IPC_GABARITOS_DIR: /gabaritos
    volumes:
      - ${IPC_GABARITOS_HOST_DIR:-../frontend/e2e/gabaritos-sinteticos}:/gabaritos:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status != 200)"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    memswap_limit: 256m
    init: true
    depends_on:
      analyzer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # analyzer_net para chamar o analyzer; edge_net para receber o Caddy; db_net para o banco.
    networks: [analyzer_net, edge_net, db_net]
    restart: unless-stopped

  mailpit:
    # Só no desenvolvimento (Fase 0): recebe os e-mails da api e os mostra numa página local,
    # sem enviá-los a ninguém. Mensagens só em memória (/tmp).
    image: axllent/mailpit:v1.32@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    user: "10001:10001"
    environment:
      MP_MAX_MESSAGES: "500"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    memswap_limit: 128m
    # edge_net: a api chega a mailpit:1025. Só a página de leitura é publicada, em 127.0.0.1.
    networks: [edge_net]
    ports:
      - "127.0.0.1:${IPC_MAIL_UI_PORT:-8125}:8025"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/caddy/Dockerfile
    image: ip-checker-web:local
    user: "10001:10001"
    read_only: true
    # O Caddy guarda estado em /data e /config; nada disso precisa sobreviver ao contêiner.
    tmpfs:
      - /data:size=1m,mode=1777,noexec,nosuid,nodev
      - /config:size=1m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    memswap_limit: 128m
    depends_on:
      api:
        condition: service_healthy
    networks: [edge_net]
    # A porta do IP-Checker nesta máquina (README, "Portas locais"). IPC_HTTP_PORT muda, por exemplo
    # nos testes, para não disputar com o compose de desenvolvimento.
    ports:
      - "127.0.0.1:${IPC_HTTP_PORT:-8180}:8080"
    restart: unless-stopped

networks:
  # Sem gateway: os contêineres desta rede só falam entre si, nunca com a internet (NFR-07).
  analyzer_net:
    internal: true
  edge_net: {}
  # Também sem gateway: só a api e o migrate alcançam o banco; o analyzer não está nela.
  db_net:
    internal: true

volumes:
  db_data: {}
